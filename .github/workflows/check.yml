name: ClassWatch

# GitHub throttles scheduled workflows hard on free public repos — in practice we
# saw 3 runs in 14 hours against a */10 cron, with gaps up to 8.5 hours. So we do
# NOT rely on the scheduler firing often. Instead each run stays alive for ~5.5
# hours and checks on its own clock, and any newly-started run cancels the old one.
# Result: near-continuous coverage even when GitHub only starts a run twice a day.

on:
  schedule:
    - cron: "*/10 * * * *"   # fires whenever GitHub feels like it; that's fine now
  workflow_dispatch:
  push:
    branches: [main]         # editing the watchlist restarts the watcher immediately

permissions:
  contents: write

concurrency:
  group: classwatch
  cancel-in-progress: true   # a fresh run takes over from the previous one

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # just under GitHub's 6-hour job ceiling

    steps:
      - uses: actions/checkout@v4

      - name: Watch for open seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECK_INTERVAL_SECONDS: "300"   # check every 5 minutes
          RUN_FOR_SECONDS: "19800"        # keep going for 5.5 hours
        run: |
          set -uo pipefail
          git config user.name  "classwatch-bot"
          git config user.email "classwatch-bot@users.noreply.github.com"

          END=$(( $(date +%s) + RUN_FOR_SECONDS ))
          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1))
            echo "::group::check #$n  $(TZ=America/New_York date '+%F %H:%M:%S ET')"
            # Never let one bad check kill the watcher — it retries next cycle.
            python3 check.py || echo "check returned non-zero; continuing"

            if ! git diff --quiet -- state.json docs/index.html; then
              git add state.json docs/index.html
              git commit -q -m "status $(TZ=America/New_York date '+%F %H:%M ET')"
              # Another run may have pushed while we were sleeping.
              git pull --rebase --autostash -q origin main || true
              git push -q origin main || echo "push failed; will retry next cycle"
            else
              echo "no change"
            fi
            echo "::endgroup::"

            # Don't oversleep past the deadline.
            now=$(date +%s)
            remaining=$(( END - now ))
            [ "$remaining" -le 0 ] && break
            sleep "$(( remaining < CHECK_INTERVAL_SECONDS ? remaining : CHECK_INTERVAL_SECONDS ))"
          done
          echo "watcher finished after $n checks — the next scheduled run takes over"
