name: ClassWatch

on:
  schedule:
    # Every 10 minutes. GitHub queues scheduled runs on a best-effort basis and
    # can delay them under load, so the Mac checker stays as the fast path.
    - cron: "*/10 * * * *"
  workflow_dispatch:      # lets you run it on demand from the Actions tab
    inputs:
      force:
        description: "Ignore active-hours gating"
        type: boolean
        default: true

permissions:
  contents: write         # needed to commit state.json + docs/index.html

concurrency:
  group: classwatch       # never let two checks race on state.json
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for open seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_CHECK: ${{ inputs.force && '1' || '' }}
        run: python3 check.py

      - name: Publish updated status
        run: |
          git config user.name  "classwatch-bot"
          git config user.email "classwatch-bot@users.noreply.github.com"
          git add state.json docs/index.html
          # Only commit when something actually changed, so the history stays
          # meaningful instead of one empty commit every ten minutes.
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "status $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            git push
          fi
